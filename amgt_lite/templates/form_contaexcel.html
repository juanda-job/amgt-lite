{% extends "base.html" %}

{% block title %}Descarga APP{% endblock %}
{% block estilo %}
<style>
  input[type="text"], select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
  }
  .box {
      border: 1px solid #8a63d3;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      background-color: #f0f0ff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .box h3 {
      margin-top: 0;
      color: #5120ad;
      font-weight: bold;
  }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
  <h2>Acceso a Conecta</h2>
  <form action="{% url 'api_contapyme_xml_to_csv_documentos' %}" method="post">
    {% csrf_token %}

    <!-- Campo de texto para ruta -->
    <label for="ruta">📂 Ruta:</label>
    <input type="text" id="ruta" name="ruta"
      placeholder="Ingresa la ruta"
      required
      oninvalid="this.setCustomValidity('La ruta es obligatoria')"
      oninput="this.setCustomValidity('')">

    <!-- Caja con dropdown -->
    <div class="box">
      <h3>Selecciona tipo</h3>
      <label for="tipo">Opción:</label>
      <select id="tipo" name="tipo" required>
        <option value="">-- Selecciona --</option>
        <option value="emisor">Emisor</option>
        <option value="receptor">Receptor</option>
      </select>
    </div>

    <!-- Botón de acción -->
    <button type="submit">Generar</button>
  </form>
</div>
{% endblock %}
